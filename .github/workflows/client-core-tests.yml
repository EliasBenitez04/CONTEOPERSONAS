name: Client Core Tests

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile client
        run: python -m compileall -q client/app client/tests server/app

      - name: Counter and tracker tests
        working-directory: client
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_counter_v4 tests.test_tracker_v41 tests.test_detector_filters_v42
