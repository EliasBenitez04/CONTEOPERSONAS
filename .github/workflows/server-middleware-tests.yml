name: Server ASGI Middleware Tests

on:
  push:
    branches: [master, 'fix/**']
    paths:
      - 'server/app/**'
      - 'server/tests/**'
      - '.github/workflows/server-middleware-tests.yml'
  pull_request:
    paths:
      - 'server/app/**'
      - 'server/tests/**'
      - '.github/workflows/server-middleware-tests.yml'
  workflow_dispatch:

jobs:
  middleware-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile server
        run: python -m compileall -q server/app server/tests
      - name: Run ASGI regression tests
        working-directory: server
        run: python -m unittest discover -s tests -p "test_security_asgi.py" -v
