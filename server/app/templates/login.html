<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema Cámara - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: linear-gradient(135deg,#111827,#1f2937); display:grid; place-items:center; }
        .login-card { width:min(430px,92vw); border:0; border-radius:20px; box-shadow:0 24px 70px rgba(0,0,0,.28); }
        .brand-icon { width:58px; height:58px; border-radius:16px; display:grid; place-items:center; background:#111827; color:#fff; font-size:1.5rem; }
    </style>
</head>
<body>
<div class="card login-card">
    <div class="card-body p-4 p-md-5">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="brand-icon"><i class="bi bi-camera-video"></i></div>
            <div>
                <h4 class="mb-0">SISTEMA CÁMARA</h4>
                <div class="text-secondary">Servidor central</div>
            </div>
        </div>

        <h5 class="mb-3">Iniciar sesión</h5>
        <div id="alertContainer"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label" for="username">Usuario</label>
                <input class="form-control form-control-lg" id="username" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-group input-group-lg">
                    <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <button class="btn btn-dark btn-lg w-100" type="submit" id="submitButton">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
        </form>
    </div>
</div>
<script>
    const form = document.getElementById('loginForm');
    const alertContainer = document.getElementById('alertContainer');
    const submitButton = document.getElementById('submitButton');

    document.getElementById('togglePassword').addEventListener('click', () => {
        const input = document.getElementById('password');
        input.type = input.type === 'password' ? 'text' : 'password';
    });

    function showError(message) {
        alertContainer.innerHTML = `<div class="alert alert-danger">${message}</div>`;
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();
        submitButton.disabled = true;
        alertContainer.innerHTML = '';
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value
                })
            });
            const data = await response.json();
            if (!response.ok) {
                showError(data.detail || 'No se pudo iniciar sesión.');
                return;
            }
            window.location.href = data.redirect || '/dashboard';
        } catch (_) {
            showError('No se pudo conectar con el servidor.');
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
