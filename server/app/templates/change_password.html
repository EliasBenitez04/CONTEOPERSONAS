<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema Cámara - Cambiar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { min-height:100vh; background:#f4f6f9; display:grid; place-items:center; }
        .card-box { width:min(520px,92vw); border:0; border-radius:18px; box-shadow:0 10px 35px rgba(15,23,42,.10); }
    </style>
</head>
<body>
<div class="card card-box">
    <div class="card-body p-4 p-md-5">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="bg-dark text-white rounded-3 p-3"><i class="bi bi-shield-lock fs-4"></i></div>
            <div>
                <h4 class="mb-0">Cambiar contraseña</h4>
                <div class="text-secondary">Usuario: {{ user.username }}</div>
            </div>
        </div>
        <div class="alert alert-warning">Por seguridad debe definir una contraseña propia antes de continuar.</div>
        <div id="alertContainer"></div>
        <form id="passwordForm">
            <div class="mb-3">
                <label class="form-label">Contraseña actual</label>
                <input type="password" class="form-control" id="currentPassword" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" class="form-control" id="newPassword" minlength="8" required>
                <div class="form-text">Mínimo 8 caracteres.</div>
            </div>
            <div class="mb-4">
                <label class="form-label">Repetir nueva contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" minlength="8" required>
            </div>
            <button class="btn btn-dark w-100" type="submit">Guardar contraseña</button>
        </form>
        <div class="text-center mt-3"><a href="/logout" class="text-secondary">Cerrar sesión</a></div>
    </div>
</div>
<script>
    const form = document.getElementById('passwordForm');
    const alertContainer = document.getElementById('alertContainer');
    function alertMsg(message, type='danger') {
        alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }
    form.addEventListener('submit', async event => {
        event.preventDefault();
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (newPassword !== confirmPassword) {
            alertMsg('Las nuevas contraseñas no coinciden.');
            return;
        }
        const response = await fetch('/api/auth/change-password', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({current_password:currentPassword,new_password:newPassword})
        });
        const data = await response.json();
        if (!response.ok) {
            alertMsg(data.detail || 'No se pudo cambiar la contraseña.');
            return;
        }
        alertMsg('Contraseña actualizada correctamente. Redirigiendo...', 'success');
        setTimeout(() => window.location.href='/dashboard', 700);
    });
</script>
</body>
</html>
